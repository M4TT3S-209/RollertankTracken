name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - claude/roller-tankstand-webapp-f1uly0
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests der Analyse-Engine
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build-Version eintragen (Cache-Update für die installierte App)
        run: |
          BUILD="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          sed -i "s/__BUILD__/${BUILD}/g" site/sw.js site/js/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
